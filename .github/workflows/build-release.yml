name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "link/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch: {}

# Pin the llvm-mos SDK release used to build. Bump manually to pick up
# toolchain updates (see https://github.com/llvm-mos/llvm-mos-sdk/releases).
env:
  LLVM_MOS_VERSION: v23.2.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache llvm-mos SDK
        id: cache-llvm-mos
        uses: actions/cache@v4
        with:
          path: llvm-mos
          key: llvm-mos-sdk-${{ env.LLVM_MOS_VERSION }}-linux

      - name: Download llvm-mos SDK
        if: steps.cache-llvm-mos.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o llvm-mos-linux.tar.xz \
            "https://github.com/llvm-mos/llvm-mos-sdk/releases/download/${LLVM_MOS_VERSION}/llvm-mos-linux.tar.xz"
          tar -xJf llvm-mos-linux.tar.xz
          rm llvm-mos-linux.tar.xz

      - name: Build game.prg
        run: |
          llvm-mos/bin/mos-vic20-clang \
            -Os -T link/vic20-fruit-invaders.ld -o game.prg \
            src/main.c src/gameplay/title.c src/gameplay/help.c src/gameplay/game.c \
            src/gameplay/lang.c src/gameplay/loading.c \
            src/graphics/sprites.c src/graphics/screen.c src/graphics/font.c \
            src/graphics/bigfont.c src/graphics/decor.c src/graphics/starfield.c \
            src/graphics/charmem.c src/sound/sound.c

      - name: Set build metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%d-%H-%M)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.timestamp }}-${{ steps.vars.outputs.sha_short }}
          name: build-${{ steps.vars.outputs.timestamp }}-${{ steps.vars.outputs.sha_short }}
          files: game.prg
